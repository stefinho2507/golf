<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f2d"><link rel="manifest" href="manifest.webmanifest"><title>GolfRange Dortmund Score</title><style>
:root{--g:#173f2d;--bg:#f5f7f3;--b:#d9ded8;--good:#e6f4ea;--bad:#fce8e6;--neutral:#eef1f3}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#152019}header{background:var(--g);color:#fff;padding:20px 18px;position:sticky;top:0;z-index:3}header h1{font-size:24px;margin:0}header p{margin:4px 0 0;opacity:.8}.wrap{max-width:760px;margin:auto;padding:14px 14px 110px}.settings,.summary,.hole{background:white;border:1px solid var(--b);border-radius:18px;padding:14px;margin-bottom:12px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings label{font-weight:700}.settings input,.settings select{width:100%;font-size:18px;padding:12px;border:1px solid var(--b);border-radius:12px;background:#fff}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{text-align:center;padding:10px;background:#f8faf7;border-radius:12px}.stat b{display:block;font-size:25px}.holehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.holehead h2{margin:0;font-size:22px}.badge{background:#e9f1ec;color:var(--g);font-weight:800;padding:7px 10px;border-radius:999px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.counter{text-align:center;border:1px solid var(--b);border-radius:14px;padding:9px 5px}.counter label{display:block;font-size:13px;min-height:32px}.value{font-size:28px;font-weight:800;margin:5px}.buttons{display:flex;gap:5px}.buttons button{flex:1;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:25px;height:42px}.net{margin-top:10px;font-weight:700;text-align:right}.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.rating button{border:1px solid var(--b);background:white;border-radius:11px;padding:10px 5px;font-weight:750}.rating button.active.neutral{background:var(--neutral);border-color:#aeb7bd}.rating button.active.good{background:var(--good);border-color:#7caf88}.rating button.active.bad{background:var(--bad);border-color:#d88f88}.autoScore{font-size:13px;opacity:.7;text-align:center;margin-top:4px}.roundstats{background:white;border:1px solid var(--b);border-radius:18px;padding:14px;margin-bottom:12px}.roundstats h3{margin:0 0 10px}.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{background:#f8faf7;border-radius:12px;padding:10px;text-align:center}.mini b{display:block;font-size:20px}.holemetrics{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.metric{font-size:13px;font-weight:800;padding:6px 9px;border-radius:999px;background:#eef2ed}.metric.gir{background:#e6f4ea}.metric.sf{background:#eef1f8}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}footer button{flex:1;padding:15px;border-radius:14px;border:1px solid var(--b);font-weight:800;font-size:17px;background:white}footer .primary{background:var(--g);color:white}@media(max-width:520px){.inputs{grid-template-columns:1fr}.settings{grid-template-columns:1fr 1fr}}
.shotOverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.shotOverlay.open{display:flex}.shotBox{background:#fff;border-radius:18px;padding:12px;max-width:620px;width:100%;max-height:92vh;overflow:auto}.shotBox img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--b)}.shotActions{display:flex;gap:8px;margin-top:10px}.shotActions button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--b);font-weight:800;background:#fff}.shotActions .primary{background:var(--g);color:#fff;border-color:var(--g)}
</style></head><body><header><h1>⛳ GolfRange Dortmund</h1><p>Score · Schläge bis Grün · Putts · Vorgabe</p></header><main class="wrap"><section class="settings"><div><label>Runde<select id="holes"><option value="9">9 Loch</option><option value="18">18 Loch</option></select></label></div><div><label>Abschlag<select id="tee"><option value="men-yellow">Herren · Gelb</option><option value="women-red">Damen · Rot</option></select></label></div><div><label>HCPI<input id="hcpi" type="number" inputmode="decimal" min="-4" max="54" step="0.1" value="54"></label></div><div><label>Datum<input id="date" type="date"></label></div></section><section class="summary"><div class="stat"><b id="total">0</b>Schläge</div><div class="stat"><b id="coursehcp">–</b>Course HCP</div><div class="stat"><b id="topar">–</b>Brutto zu Par</div><div class="stat"><b id="nettopar">–</b>Netto zu Par</div><div class="stat"><b id="green">0</b>bis Grün</div><div class="stat"><b id="putts">0</b>Putts</div></section><section class="roundstats"><h3>Rundenstatistik</h3><div class="miniGrid"><div class="mini"><b id="stableford">0</b>Stableford</div><div class="mini"><b id="gir">0/0</b>GIR</div><div class="mini"><b id="girpct">0%</b>GIR-Quote</div><div class="mini"><b id="oneputts">0</b>1-Putts</div><div class="mini"><b id="threeputts">0</b>3+ Putts</div><div class="mini"><b id="feelings">0 / 0 / 0</b>Gut / Neutral / Schlecht</div></div></section><div id="cards"></div></main><footer><button class="primary" id="save">Runde speichern</button><button id="reset">Neue Runde</button></footer><div class="shotOverlay" id="shotOverlay"><div class="shotBox"><img id="shotPreview" alt="Zusammenfassung der Golfrunde"><div class="shotActions"><button id="closeShot">Schließen</button><button class="primary" id="shareShot">Bild teilen / sichern</button></div></div></div><script>
const basePars=[4,4,4,3,3,4,3,3,5], baseSI=[11,15,3,17,7,5,9,13,1];
let scores=[]; const $=x=>document.getElementById(x); $('date').value=new Date().toISOString().slice(0,10);
function count(){return +$('holes').value} function pars(){return Array.from({length:count()},(_,i)=>basePars[i%9])}
function sis(){return count()===9?[6,8,2,9,4,3,5,7,1]:Array.from({length:18},(_,i)=>baseSI[i%9]+(i>=9?1:0))}
function ensure(){while(scores.length<count())scores.push({g:0,p:0,r:'neutral'});scores=scores.slice(0,count());scores=scores.map(x=>({g:+(x.g||0),p:+(x.p||0),r:['neutral','good','bad'].includes(x.r)?x.r:'neutral'}))}
function strokes(x){return x.g+x.p}
function ch(){let h=parseFloat($('hcpi').value);if(Number.isNaN(h))return null;let n=count(),tee=$('tee').value,data={
'men-yellow':{9:[31.4,115,33],18:[62.8,115,66]},
'women-red':{9:[31.9,112,33],18:[63.8,112,66]}
}[tee]||{9:[31.4,115,33],18:[62.8,115,66]};let [cr,slope,par]=data[n];let handicapForRound=n===9?h/2:h;return Math.round(handicapForRound*slope/113+(cr-par))}
function allowance(i,c){if(c==null||c<=0)return 0;let idx=sis()[i], n=count();return Math.floor((c-1)/n)+((c-1)%n>=idx-1?1:0)}
function isGIR(i,x){return strokes(x)>0&&x.g>0&&x.g<=pars()[i]-2}
function stablefordPts(i,x,c){let s=strokes(x);if(!s)return 0;let net=s-allowance(i,c),par=pars()[i];return Math.max(0,par+2-net)}
function render(){ensure();let ps=pars(),c=ch(),html='';scores.forEach((x,i)=>{let s=strokes(x),a=allowance(i,c),net=s?s-a:0;html+=`<section class="hole"><div class="holehead"><h2>Loch ${i+1} · Par ${ps[i]}</h2><span class="badge">HCP ${sis()[i]} · Vorgabe +${a}</span></div><div class="inputs"><div class="counter"><label>Schläge gesamt</label><div class="value">${s}</div><div class="autoScore">automatisch</div></div>${counter(i,'g','bis Grün',x.g)}${counter(i,'p','Putts',x.p)}</div><div class="rating"><button class="neutral ${x.r==='neutral'?'active':''}" onclick="rateHole(${i},'neutral')">Neutral</button><button class="good ${x.r==='good'?'active':''}" onclick="rateHole(${i},'good')">Gut</button><button class="bad ${x.r==='bad'?'active':''}" onclick="rateHole(${i},'bad')">Schlecht</button></div><div class="holemetrics">${s?`<span class="metric ${isGIR(i,x)?'gir':''}">GIR ${isGIR(i,x)?'✓':'–'}</span><span class="metric sf">${stablefordPts(i,x,c)} Stableford</span>`:''}</div><div class="net">${s?`Brutto ${s} · Netto ${net} · Netto ${fmt(net-ps[i])}`:'Noch kein Score'}</div></section>`});$('cards').innerHTML=html; summary()}
function counter(i,k,label,v){return `<div class="counter"><label>${label}</label><div class="value">${v}</div><div class="buttons"><button onclick="chg(${i},'${k}',-1)">−</button><button onclick="chg(${i},'${k}',1)">+</button></div></div>`}
window.chg=(i,k,d)=>{scores[i][k]=Math.max(0,scores[i][k]+d);render();autosave()}; window.rateHole=(i,r)=>{scores[i].r=r;render();autosave()}; function fmt(n){return n===0?'E':n>0?'+'+n:String(n)}
function summary(){let ps=pars(),entered=scores.filter(x=>strokes(x)>0),t=scores.reduce((a,x)=>a+strokes(x),0),g=scores.reduce((a,x)=>a+x.g,0),p=scores.reduce((a,x)=>a+x.p,0),c=ch();$('total').textContent=t;$('green').textContent=g;$('putts').textContent=p;$('coursehcp').textContent=c??'–';let bp=scores.reduce((a,x,i)=>a+(strokes(x)?strokes(x)-ps[i]:0),0),np=scores.reduce((a,x,i)=>a+(strokes(x)?strokes(x)-allowance(i,c)-ps[i]:0),0);$('topar').textContent=entered.length?fmt(bp):'–';$('nettopar').textContent=entered.length?fmt(np):'–';let sf=scores.reduce((a,x,i)=>a+stablefordPts(i,x,c),0),girN=scores.reduce((a,x,i)=>a+(isGIR(i,x)?1:0),0),played=entered.length,one=scores.filter(x=>strokes(x)>0&&x.p===1).length,three=scores.filter(x=>strokes(x)>0&&x.p>=3).length,good=scores.filter(x=>strokes(x)>0&&x.r==='good').length,neutral=scores.filter(x=>strokes(x)>0&&x.r==='neutral').length,bad=scores.filter(x=>strokes(x)>0&&x.r==='bad').length;$('stableford').textContent=sf;$('gir').textContent=`${girN}/${played}`;$('girpct').textContent=played?Math.round(girN/played*100)+'%':'0%';$('oneputts').textContent=one;$('threeputts').textContent=three;$('feelings').textContent=`${good} / ${neutral} / ${bad}`}
function autosave(){localStorage.setItem('grd-current',JSON.stringify({scores,h:$('holes').value,tee:$('tee').value,hcpi:$('hcpi').value,date:$('date').value}))}function load(){try{let d=JSON.parse(localStorage.getItem('grd-current'));if(d){scores=d.scores||[];$('holes').value=d.h||9;$('tee').value=(d.tee==='women-yellow'?'women-red':(d.tee||'men-yellow'));$('hcpi').value=d.hcpi??54;$('date').value=d.date||$('date').value}}catch(e){}}
function teeName(){return ({'men-yellow':'Herren · Gelb','women-red':'Damen · Rot'})[$('tee').value]||$('tee').value}
function roundImage(){let ps=pars(),c=ch(),n=count(),rowH=42,w=1000,h=440+n*rowH+90,cv=document.createElement('canvas');cv.width=w;cv.height=h;let x=cv.getContext('2d');x.fillStyle='#f5f7f3';x.fillRect(0,0,w,h);x.fillStyle='#173f2d';x.fillRect(0,0,w,155);x.fillStyle='#fff';x.font='bold 36px -apple-system,Arial';x.fillText('GolfRange Dortmund',40,55);x.font='22px -apple-system,Arial';x.fillText(`${$('date').value} · ${n} Loch · ${teeName()} · HCPI ${$('hcpi').value}`,40,94);x.fillText(`Course HCP ${c??'–'}`,40,128);
let total=scores.reduce((a,z)=>a+strokes(z),0),putts=scores.reduce((a,z)=>a+z.p,0),green=scores.reduce((a,z)=>a+z.g,0),bp=scores.reduce((a,z,i)=>a+(strokes(z)?strokes(z)-ps[i]:0),0),np=scores.reduce((a,z,i)=>a+(strokes(z)?strokes(z)-allowance(i,c)-ps[i]:0),0),sf=scores.reduce((a,z,i)=>a+stablefordPts(i,z,c),0),played=scores.filter(z=>strokes(z)>0).length,girN=scores.reduce((a,z,i)=>a+(isGIR(i,z)?1:0),0),one=scores.filter(z=>strokes(z)>0&&z.p===1).length,three=scores.filter(z=>strokes(z)>0&&z.p>=3).length,good=scores.filter(z=>strokes(z)>0&&z.r==='good').length,neutral=scores.filter(z=>strokes(z)>0&&z.r==='neutral').length,bad=scores.filter(z=>strokes(z)>0&&z.r==='bad').length;
x.fillStyle='#152019';x.font='bold 27px -apple-system,Arial';x.fillText(`${total} Schläge   ·   ${putts} Putts   ·   ${sf} Stableford`,40,205);x.font='20px -apple-system,Arial';x.fillText(`Brutto ${fmt(bp)}   ·   Netto ${fmt(np)}   ·   GIR ${girN}/${played} (${played?Math.round(girN/played*100):0}%)`,40,242);x.fillText(`1-Putts ${one}   ·   3+ Putts ${three}   ·   Gut ${good} / Neutral ${neutral} / Schlecht ${bad}`,40,276);
let y=335;x.font='bold 16px -apple-system,Arial';x.fillStyle='#173f2d';['Loch','Par','Vorg.','Grün','Putts','Score','Netto','GIR','Stbf.','Gefühl'].forEach((t,j)=>x.fillText(t,[35,100,155,235,310,385,465,545,610,690][j],y));x.strokeStyle='#d9ded8';x.beginPath();x.moveTo(30,y+12);x.lineTo(965,y+12);x.stroke();y+=38;x.font='17px -apple-system,Arial';scores.forEach((z,i)=>{let sc=strokes(z),a=allowance(i,c),net=sc?sc-a:0,feel=z.r==='good'?'Gut':z.r==='bad'?'Schlecht':'Neutral',gir=isGIR(i,z)?'✓':'–',sfpt=stablefordPts(i,z,c);x.fillStyle=i%2?'#eef2ed':'#ffffff';x.fillRect(25,y-27,940,rowH);x.fillStyle='#152019';[String(i+1),String(ps[i]),'+'+a,String(z.g),String(z.p),String(sc),sc?String(net):'–',gir,String(sfpt),feel].forEach((t,j)=>x.fillText(t,[35,100,155,235,310,385,465,545,610,690][j],y));y+=rowH});x.fillStyle='#667069';x.font='16px -apple-system,Arial';x.fillText('GIR = Grün in Par − 2 Schlägen oder besser · Score = bis Grün + Putts',40,h-28);return cv}
let lastShotBlob=null;function showShot(){let cv=roundImage();$('shotPreview').src=cv.toDataURL('image/png');cv.toBlob(b=>lastShotBlob=b,'image/png');$('shotOverlay').classList.add('open')}
async function shareShot(){if(!lastShotBlob)return;let name=`golfrunde-${$('date').value||'score'}.png`,file=new File([lastShotBlob],name,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Golfrunde GolfRange Dortmund'});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(lastShotBlob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('holes').onchange=()=>{render();autosave()};$('tee').onchange=()=>{render();autosave()};$('hcpi').oninput=()=>{render();autosave()};$('date').onchange=autosave;$('reset').onclick=()=>{if(confirm('Neue Runde starten?')){scores=[];localStorage.removeItem('grd-current');render()}};$('save').onclick=()=>{let hist=JSON.parse(localStorage.getItem('grd-history')||'[]');hist.unshift({date:$('date').value,hcpi:$('hcpi').value,tee:$('tee').value,holes:count(),scores:JSON.parse(JSON.stringify(scores)),version:6});localStorage.setItem('grd-history',JSON.stringify(hist.slice(0,30)));showShot()};$('closeShot').onclick=()=>$('shotOverlay').classList.remove('open');$('shareShot').onclick=shareShot;$('shotOverlay').onclick=e=>{if(e.target===$('shotOverlay'))$('shotOverlay').classList.remove('open')};load();render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
